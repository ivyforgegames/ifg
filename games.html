<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Games — Ivy Forge Games</title>
  <link rel="icon" type="image/png" href="sword-ivy.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --forest: #151A13;
      --forest-mid: #1E251B;
      --parchment: #F4EFE4;
      --ink-dark: #1C2219;
      --ink-light: #F6F2E9;
      --muted: #B6C1B0;
      --moss: #84B56C;
      --amber: #E5A45B;
      --line: rgba(244, 239, 228, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: var(--moss);
      color: var(--ink-dark);
    }

    body {
      background-color: var(--forest);
      color: var(--ink-light);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    @keyframes dropAndBounce {
      0% {
        transform: translateY(-90px) scale(0.985);
        opacity: 0;
      }
      65% {
        transform: translateY(6px) scale(1.003, 0.994);
        opacity: 1;
      }
      82% {
        transform: translateY(-8px) scale(0.998, 1.003);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1, 1);
        opacity: 1;
      }
    }

    @keyframes hopUpThenFall {
      0% {
        transform: translateY(0) scale(1, 1) rotate(0deg);
        opacity: 1;
      }
      24% {
        transform: translateY(-34px) scale(0.992, 1.01) rotate(-0.6deg);
        opacity: 1;
      }
      100% {
        transform: translateY(115vh) scale(0.985, 1.015) rotate(1.2deg);
        opacity: 0.9;
      }
    }

    #games-shell {
      will-change: transform, opacity;
      transform: translateY(-90px);
      opacity: 0;
    }

    #games-shell.bouncing-in {
      animation: dropAndBounce 0.78s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    #games-shell.exiting-hop-fall {
      animation: hopUpThenFall 0.72s cubic-bezier(0.36, 0.07, 0.75, 0.35) forwards;
      pointer-events: none;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1.5px dashed var(--line);
      margin-bottom: 44px;
    }

    .brand {
      font-family: 'Fraunces', serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--parchment);
    }

    .back-link {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--amber);
    }

    .construction-card {
      background: var(--parchment);
      color: var(--ink-dark);
      border-radius: 24px;
      padding: 42px 34px;
      text-align: center;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }

    .construction-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: inherit;
    }

    .construction-card > * {
      position: relative;
      z-index: 2;
    }

    .scribble {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #4E733D;
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 4vw, 2.9rem);
      font-weight: 800;
      margin-bottom: 18px;
    }

    .img-frame img {
      max-width: 240px;
      max-height: 210px;
      object-fit: contain;
      background: #FFFFFF;
      padding: 12px;
      border-radius: 18px;
      border: 2.5px solid rgba(78, 115, 61, 0.35);
      box-shadow: 0 10px 24px rgba(28, 34, 25, 0.14);
      transform: rotate(-1.5deg);
      margin: 0 auto 20px;
      display: block;
    }

    .construction-card p {
      color: #3B4436;
      max-width: 48ch;
      margin: 0 auto 24px;
    }

    .btn-primary {
      display: inline-block;
      background: var(--forest);
      color: var(--parchment);
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--moss);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--moss);
    }
  </style>
</head>
<body>
  <div id="games-shell">
    <div class="wrap">
      <header class="top-bar">
        <a href="index.html" class="brand go-back">Ivy Forge Games</a>
        <a href="index.html" class="back-link go-back">← Back to Main Page</a>
      </header>

      <main class="construction-card">
        <span class="scribble">Under Construction 🔨</span>
        <h1>Our Games</h1>
        <div class="img-frame">
          <img src="knight.png" alt="Ivy Forge Games knight hard at work on the games slate" onerror="this.style.display='none'" />
        </div>
        <p>
          Still putting the finishing touches on our first few games. If you've got a build at 80–95% and want to chat, jump in Discord or drop an email.
        </p>
        <a href="https://discord.gg/5h7meEPnCH" target="_blank" rel="noopener noreferrer" class="btn-primary">
          Pitch on Discord ↗
        </a>
      </main>
    </div>
  </div>

  <script>
    const shell = document.getElementById('games-shell');

    setTimeout(() => {
      if (shell) shell.classList.add('bouncing-in');
    }, 50);

    document.querySelectorAll('a.go-back').forEach((link) => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (!href || !shell) return;
        e.preventDefault();
        shell.classList.remove('bouncing-in');
        void shell.offsetWidth;
        shell.classList.add('exiting-hop-fall');
        setTimeout(() => {
          window.location.href = href;
        }, 680);
      });
    });
  </script>
</body>
</html>
